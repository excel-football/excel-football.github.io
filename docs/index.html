<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตารางเตะบอล 4 ทีม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pitch:#1f6b3a; --pitch-dark:#174f2b; --chalk:#f3f7f1;
  --bg:#e9efe8; --surface:#ffffff; --ink:#18241b; --muted:#5d6b60; --line:#cfd9cf;
  --next:#fff4c2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --pitch:#1b5c32; --pitch-dark:#123f22; --bg:#121813; --surface:#1b231d; --ink:#e6eee6;
    --muted:#9aa89c; --line:#2e3a30; --next:#3a3418;
  }
}
:root[data-theme="dark"]{
  --pitch:#1b5c32; --pitch-dark:#123f22; --bg:#121813; --surface:#1b231d; --ink:#e6eee6;
  --muted:#9aa89c; --line:#2e3a30; --next:#3a3418;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bai Jamjuree","Noto Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;
  font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #ffb300;outline-offset:2px}

/* Header: the pitch */
header{background:var(--pitch);color:var(--chalk);position:relative;overflow:hidden;
  padding:28px 20px 30px}
header::before{content:"";position:absolute;inset:12px;border:2px solid rgba(243,247,241,.35);border-radius:4px;pointer-events:none}
header::after{content:"";position:absolute;width:140px;height:140px;border:2px solid rgba(243,247,241,.35);
  border-radius:50%;right:-40px;top:50%;transform:translateY(-50%);pointer-events:none}
.wrap{max-width:760px;margin:0 auto;position:relative}
h1{margin:0;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.15;font-weight:700}
.sub{margin:6px 0 0;opacity:.85}
.sync{margin:4px 0 0;font-size:.85rem;opacity:.85}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;
  background:#9aa59b;vertical-align:middle}
.sync.ok::before{background:#7ee08a}
.sync.busy::before{background:#ffd54f}
.sync.err::before{background:#ff8a80}

main{max-width:760px;margin:0 auto;padding:18px 14px 40px}
section{margin-top:22px}
h2{font-size:1.15rem;margin:0 0 10px;font-weight:600}

/* Bibs */
.bib{display:inline-flex;align-items:center;justify-content:center;min-width:78px;padding:4px 10px;
  border-radius:6px;font-weight:600;font-size:.92rem;border:2px solid transparent;white-space:nowrap}
.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.team-pick{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
.team-pick .slot{color:var(--muted);font-size:.85rem}
.team-pick select{width:100%;margin-top:6px;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}

/* Standings: the bold bit */
.standings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stand{border-radius:12px;padding:12px 8px 10px;text-align:center;position:relative;border:2px solid transparent}
.stand .rank{position:absolute;top:6px;left:9px;font-size:.8rem;opacity:.75}
.stand .pts{font-size:2.6rem;font-weight:700;line-height:1}
.stand .lbl{font-size:.8rem;opacity:.8}
.stand .name{font-weight:600;margin-bottom:4px}
.stand .rec{font-size:.78rem;opacity:.85;margin-top:4px}

/* Fixtures */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fx{display:grid;grid-template-columns:34px 1fr auto 1fr 40px;align-items:center;gap:8px;
  padding:9px 10px;border-top:1px solid var(--line)}
.fx:first-child{border-top:0}
.fx.next{background:var(--next)}
.fx .no{font-weight:600;color:var(--muted);text-align:center}
.fx .t1{justify-self:end} .fx .t2{justify-self:start}
.score{display:flex;align-items:center;gap:4px}
.score input{width:44px;height:40px;text-align:center;font-size:1.1rem;font-weight:600;
  border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.score input::-webkit-inner-spin-button{display:none}
.score input{-moz-appearance:textfield;appearance:textfield}
.fx .st{text-align:center;font-size:.8rem;color:var(--muted)}
.fx .st.done{color:var(--pitch);font-size:1.1rem;font-weight:700}
.fx .st.nxt{color:#a06a00;font-weight:600}
.rule{padding:12px 14px;background:var(--bg);border-top:1px dashed var(--muted);border-bottom:1px dashed var(--muted);
  font-size:.92rem;color:var(--muted)}

/* Head-to-head */
.h2h{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.h2h div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;
  display:flex;align-items:center;gap:6px;font-size:.9rem}
.h2h .n{margin-left:auto;font-weight:700;font-size:1.05rem}
.h2h .bib{min-width:0;padding:2px 8px;font-size:.82rem}
.note{color:var(--muted);font-size:.85rem;margin:8px 2px 0}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn.danger{border-color:#c62828;color:#c62828}

@media (max-width:560px){
  .teams,.standings{grid-template-columns:repeat(2,1fr)}
  .fx{grid-template-columns:26px 1fr auto 1fr 26px;gap:5px;padding:9px 6px}
  .bib{min-width:62px;padding:4px 6px;font-size:.84rem}
  .score input{width:38px;height:38px}
}
@media (prefers-reduced-motion:no-preference){
  .stand{transition:transform .25s ease}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>ตารางเตะบอล 4 ทีม</h1>
    <p class="sub">เตะนัดละ 8 นาที · ชนะ 3 เสมอ 1 แพ้ 0</p>
    <p class="sync" id="sync" role="status">กำลังเชื่อมต่อ…</p>
  </div>
</header>

<main>
  <section>
    <h2>สีเสื้อแต่ละทีม</h2>
    <div class="teams" id="teams"></div>
  </section>

  <section>
    <h2>คะแนนรวม</h2>
    <div class="standings" id="standings"></div>
  </section>

  <section>
    <h2>ตารางแข่ง</h2>
    <div class="card" id="fixtures"></div>
  </section>

  <section>
    <h2>จำนวนนัดที่เจอกัน</h2>
    <div class="h2h" id="h2h"></div>
    <p class="note">นับนัดที่ 1–14 (ไม่รวมนัดสำรอง 15–16)</p>
  </section>

  <div class="actions">
    <button class="btn danger" id="reset">ล้างสกอร์ทั้งหมด</button>
  </div>
</main>

<script>
(function(){
  var COLORS = {
    White:{th:"ขาว",bg:"#ffffff",fg:"#1a1a1a",bd:"#9aa59b"},
    Red:{th:"แดง",bg:"#e53935",fg:"#ffffff"},
    Yellow:{th:"เหลือง",bg:"#ffd600",fg:"#1a1a1a"},
    Blue:{th:"น้ำเงิน",bg:"#1e5fd6",fg:"#ffffff"},
    Black:{th:"ดำ",bg:"#1a1a1a",fg:"#ffffff",bd:"#666"},
    Green:{th:"เขียว",bg:"#43a047",fg:"#ffffff"},
    Purple:{th:"ม่วง",bg:"#8e44ad",fg:"#ffffff"},
    Orange:{th:"ส้ม",bg:"#fb8c00",fg:"#1a1a1a"}
  };
  var SLOTS = ["A","B","C","D"];
  // Fixtures from the sheet (by team slot); 15–16 are the optional extra matches
  var FIX = [[0,1],[2,3],[0,3],[2,1],[0,2],[1,3],[0,1],[2,3],[0,3],[2,1],[0,2],[1,3],[0,1],[2,3],[0,3],[2,1]];

  var KEY = "football_table_v1";
  // Online sync: the whole state is one JSON value in keyjson-storage (writes replace it).
  // There is no push from the server, so every viewer polls.
  var API = "https://api.diewland.com/jsondb/", DB_NAME = "football", DB_SECRET = "saturday";
  var POLL_MS = 3000, PUSH_DELAY_MS = 400;
  var state = {teams:["White","Red","Yellow","Blue"], scores:FIX.map(function(){return ["",""];}), last:null, rev:""};
  function valid(s){
    return !!s && Array.isArray(s.teams) && s.teams.length===4 &&
      s.teams.every(function(t){ return COLORS.hasOwnProperty(t); }) &&
      Array.isArray(s.scores) && s.scores.length===FIX.length &&
      s.scores.every(function(x){ return Array.isArray(x) && x.length===2; });
  }
  try{ var s = JSON.parse(localStorage.getItem(KEY)); if(valid(s)) state = s; }catch(e){}
  function store(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  // Local edits are recorded per field ("s<match>.<side>", "t<slot>", "last") and pushed after a
  // short delay. A push reads the latest online value first and writes only those fields onto it,
  // so two devices editing different matches don't erase each other. `dirty` counts unsent edits,
  // so a poll never overwrites them.
  var dirty = 0, changed = {}, pushTimer = null, pushing = false;
  function newRev(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function save(keys){
    keys.forEach(function(k){ changed[k] = 1; });
    state.rev = newRev(); store(); dirty++;
    clearTimeout(pushTimer); pushTimer = setTimeout(push, PUSH_DELAY_MS);
    setSync("busy","กำลังบันทึก…");
  }
  function setSync(cls, text){ var el=document.getElementById("sync"); el.className="sync "+cls; el.textContent=text; }
  function getField(o, k){
    if(k==="last") return o.last;
    if(k[0]==="t") return o.teams[+k.slice(1)];
    var p=k.slice(1).split("."); return o.scores[+p[0]][+p[1]];
  }
  function setField(o, k, v){
    if(k==="last") o.last = v;
    else if(k[0]==="t") o.teams[+k.slice(1)] = v;
    else { var p=k.slice(1).split("."); o.scores[+p[0]][+p[1]] = v; }
  }
  // `key` reads only that top-level property of the online value
  function apiGet(key){
    var url = API + "?name=" + encodeURIComponent(DB_NAME) + (key ? "&key=" + encodeURIComponent(key) : "");
    return fetch(url, {cache:"no-store"}).then(function(r){ return r.json(); });
  }
  function push(){
    if(pushing){ pushTimer = setTimeout(push, PUSH_DELAY_MS); return; }
    pushing = true;
    var sent = dirty, keys = changed; changed = {};
    apiGet().then(function(resp){
      // Merge onto the online value (or publish ours if there is nothing usable online)
      var base = resp.success && valid(resp.data) ? resp.data : JSON.parse(JSON.stringify(state));
      Object.keys(keys).forEach(function(k){ setField(base, k, getField(state, k)); });
      Object.keys(changed).forEach(function(k){ setField(base, k, getField(state, k)); });
      base.rev = newRev(); state = base; store();
      return fetch(API, {method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name:DB_NAME, secret:DB_SECRET, value:base})}).then(function(r){ return r.json(); });
    }).then(function(resp){
      if(!resp.success) throw new Error(resp.message);
      dirty -= sent; if(!dirty) setSync("ok","ซิงก์ออนไลน์แล้ว");
      renderShared();
    }).catch(function(){
      Object.keys(keys).forEach(function(k){ changed[k] = 1; });
      setSync("err","ออฟไลน์ · จะลองบันทึกใหม่");
    }).then(function(){ pushing = false; });
  }
  function editing(){
    var a = document.activeElement;
    return !!a && a.tagName==="INPUT" && document.getElementById("fixtures").contains(a);
  }
  // Polls read only `rev`; the full value is fetched when it differs (or isn't readable)
  function pull(){
    if(dirty){ if(!pushing) push(); return; }
    apiGet("rev").then(function(resp){
      if(dirty) return;
      if(resp.success && resp.data===state.rev){ setSync("ok","ซิงก์ออนไลน์แล้ว"); return; }
      pullFull();
    }).catch(function(){ setSync("err","ออฟไลน์ · กำลังลองใหม่"); });
  }
  function pullFull(){
    apiGet().then(function(resp){
      if(dirty) return;
      if(!resp.success || !valid(resp.data)){
        // Nothing usable online yet: publish this device's state
        if(resp.success || resp.message==="data not found"){ dirty++; push(); }
        else setSync("err","เชื่อมต่อไม่ได้ · "+resp.message);
        return;
      }
      setSync("ok","ซิงก์ออนไลน์แล้ว");
      if(resp.data.rev===state.rev) return;
      state = resp.data; store(); renderShared();
    }).catch(function(){ setSync("err","ออฟไลน์ · กำลังลองใหม่"); });
  }
  // Re-render after state arrives from online; the fixtures wait while a score is being typed
  // (they re-render on that input's change event anyway).
  function renderShared(){
    renderTeams(); renderStandings(); renderH2H();
    if(!editing()) renderFixtures();
  }

  function bib(slot, extra){
    var c = COLORS[state.teams[slot]];
    var st = "background:"+c.bg+";color:"+c.fg+";border-color:"+(c.bd||c.bg);
    return '<span class="bib'+(extra?" "+extra:"")+'" style="'+st+'">'+c.th+'</span>';
  }
  function played(i){ var s=state.scores[i]; return s[0]!=="" && s[1]!==""; }

  function renderTeams(){
    var el = document.getElementById("teams"); el.innerHTML = "";
    SLOTS.forEach(function(sl,i){
      var opts = Object.keys(COLORS).map(function(k){
        return '<option value="'+k+'"'+(state.teams[i]===k?" selected":"")+'>'+COLORS[k].th+' ('+k+')</option>';
      }).join("");
      var d = document.createElement("div"); d.className="team-pick";
      d.innerHTML = '<div class="slot">ทีม '+sl+'</div>'+bib(i)+
        '<select aria-label="สีทีม '+sl+'" data-i="'+i+'">'+opts+'</select>';
      el.appendChild(d);
    });
    el.querySelectorAll("select").forEach(function(s){
      s.addEventListener("change",function(){ state.teams[+s.dataset.i]=s.value; save(["t"+s.dataset.i]); renderAll(); });
    });
  }

  function renderFixtures(){
    var el = document.getElementById("fixtures"); el.innerHTML = "";
    // Next match is the first unplayed one after the last result entered, wrapping to the
    // top; otherwise the first unplayed of 1–14
    var nextIdx = -1;
    if(typeof state.last==="number" && played(state.last)){
      for(var j=1;j<FIX.length;j++){
        var c=(state.last+j)%FIX.length;
        if(!played(c)){ nextIdx=c; break; }
      }
    } else {
      for(var k=0;k<14;k++){ if(!played(k)){ nextIdx=k; break; } }
    }
    FIX.forEach(function(f,i){
      if(i===14){
        var r=document.createElement("div"); r.className="rule";
        r.textContent="ถ้าเวลาเหลือมากกว่า 16 นาที ให้เตะนัด 15, 16 · ถ้าเวลาเหลือพอเตะแค่ 1 นัด ให้เป่ายิ้งฉุบสุ่ม 2 ทีมมาเตะ";
        el.appendChild(r);
      }
      var row=document.createElement("div");
      row.className="fx"+(i===nextIdx?" next":"");
      var st = played(i) ? '<div class="st done" title="เตะแล้ว">✓</div>'
             : (i===nextIdx ? '<div class="st nxt">ต่อไป</div>' : '<div class="st"></div>');
      row.innerHTML='<div class="no">'+(i+1)+'</div>'+
        '<div class="t1">'+bib(f[0])+'</div>'+
        '<div class="score"><input inputmode="numeric" maxlength="2" aria-label="ประตูนัด '+(i+1)+' ทีมแรก" data-i="'+i+'" data-s="0" value="'+state.scores[i][0]+'">'+
        '<span>–</span><input inputmode="numeric" maxlength="2" aria-label="ประตูนัด '+(i+1)+' ทีมที่สอง" data-i="'+i+'" data-s="1" value="'+state.scores[i][1]+'"></div>'+
        '<div class="t2">'+bib(f[1])+'</div>'+st;
      el.appendChild(row);
    });
    el.querySelectorAll("input").forEach(function(inp){
      inp.addEventListener("input",function(){
        inp.value = inp.value.replace(/\D/g,"");
        var i = +inp.dataset.i;
        state.scores[i][+inp.dataset.s] = inp.value;
        var keys = ["s"+i+"."+inp.dataset.s];
        if(played(i)){ state.last = i; keys.push("last"); }
        save(keys);
        renderStandings();
      });
      inp.addEventListener("change",function(){ renderFixtures(); });
    });
  }

  function renderStandings(){
    var t = SLOTS.map(function(_,i){ return {i:i,pts:0,p:0,w:0,d:0,l:0,gd:0}; });
    FIX.forEach(function(f,i){
      if(!played(i)) return;
      var a=+state.scores[i][0], b=+state.scores[i][1], A=t[f[0]], B=t[f[1]];
      A.p++; B.p++; A.gd+=a-b; B.gd+=b-a;
      if(a>b){A.pts+=3;A.w++;B.l++;} else if(a<b){B.pts+=3;B.w++;A.l++;} else {A.pts++;B.pts++;A.d++;B.d++;}
    });
    var sorted = t.slice().sort(function(x,y){ return y.pts-x.pts || y.gd-x.gd || x.i-y.i; });
    var el=document.getElementById("standings"); el.innerHTML="";
    sorted.forEach(function(r,n){
      var c=COLORS[state.teams[r.i]];
      var d=document.createElement("div"); d.className="stand";
      d.style.background=c.bg; d.style.color=c.fg; d.style.borderColor=c.bd||c.bg;
      d.innerHTML='<span class="rank">#'+(n+1)+'</span><div class="name">'+c.th+'</div>'+
        '<div class="pts">'+r.pts+'</div><div class="lbl">คะแนน</div>'+
        '<div class="rec">เตะ '+r.p+' · ชนะ '+r.w+' เสมอ '+r.d+' แพ้ '+r.l+' · ได้เสีย '+(r.gd>0?"+":"")+r.gd+'</div>';
      el.appendChild(d);
    });
  }

  function renderH2H(){
    var counts={};
    FIX.slice(0,14).forEach(function(f){ var k=Math.min(f[0],f[1])+"-"+Math.max(f[0],f[1]); counts[k]=(counts[k]||0)+1; });
    var el=document.getElementById("h2h"); el.innerHTML="";
    Object.keys(counts).sort().forEach(function(k){
      var p=k.split("-").map(Number);
      var d=document.createElement("div");
      d.innerHTML=bib(p[0])+'<span>vs</span>'+bib(p[1])+'<span class="n">'+counts[k]+' นัด</span>';
      el.appendChild(d);
    });
  }

  function renderAll(){ renderTeams(); renderStandings(); renderFixtures(); renderH2H(); }

  document.getElementById("reset").addEventListener("click",function(){
    if(!confirm("ล้างสกอร์ทั้งหมด?")) return;
    state.scores = FIX.map(function(){return ["",""];}); state.last = null;
    var keys = ["last"]; FIX.forEach(function(_,i){ keys.push("s"+i+".0","s"+i+".1"); });
    save(keys); renderAll();
  });

  renderAll();
  pull();
  setInterval(function(){ if(!document.hidden) pull(); }, POLL_MS);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) pull(); });
})();
</script>
</body>
</html>
